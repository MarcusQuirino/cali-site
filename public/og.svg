<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Everayy — Commissioned Fiction">
  <rect width="1200" height="630" fill="#84DCC6"/>

  <defs>
    <pattern id="hatch" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 14 L14 0" stroke="#4B4E6D" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#hatch)"/>

  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#222222" stroke-width="10"/>

  <g transform="rotate(-2 600 270)">
    <rect x="80" y="160" width="900" height="220" fill="#FFFFFF" stroke="#222222" stroke-width="8"/>
    <rect x="92" y="172" width="900" height="220" fill="#222222" opacity="0.18"/>
    <rect x="80" y="160" width="900" height="220" fill="#FFFFFF" stroke="#222222" stroke-width="8"/>
    <text x="530" y="310" font-family="Impact, 'Arial Black', sans-serif"
          font-size="160" font-weight="900" fill="#222222"
          text-anchor="middle" letter-spacing="-2">EVERAYY</text>
  </g>

  <g transform="rotate(1.5 600 470)">
    <rect x="180" y="440" width="840" height="64" fill="#4B4E6D" stroke="#222222" stroke-width="6"/>
    <text x="600" y="484" font-family="'Courier New', monospace" font-size="22"
          font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">
      COMMISSIONED FICTION · WRITTEN TO ORDER
    </text>
  </g>

  <g transform="translate(80 520) rotate(-4)">
    <rect width="200" height="60" fill="#FFFFFF" stroke="#222222" stroke-width="5"/>
    <text x="100" y="40" font-family="'Courier New', monospace" font-size="20"
          font-weight="700" fill="#222222" text-anchor="middle">everayy.com</text>
  </g>
</svg>
